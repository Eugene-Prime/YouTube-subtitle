#!name = 🍿 DualSubs YouTube Fixed (Quantumult X)
#!desc = UNTESTED on Quantumult X｜修复 YouTube 字幕加载失败
#!author = Original: DualSubs / VirgilClyne | Fixed by Eugene-Prime
#!homepage = https://github.com/Eugene-Prime/YouTube-subtitle
#!version = 1.1.0-local

# UNTESTED: this file follows the upstream Quantumult X template.
# 未实机测试；QX 没有 Surge 参数面板，请在 DualSubs/BoxJs 中将 Type 设为 Translate。

#[rewrite_local]
^https?:\/\/([\w-]+)\.googlevideo\.com\/initplayback(\?.*oad=.+)$ url reject-dict

#[Script]
^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$ url script-request-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.request.bundle.js?v=1.0.4-local
^https?:\/\/(www|m|tv)\.youtube\.com\/youtubei\/v1\/player(\?.+)?$ url script-response-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.response.bundle.js?v=1.0.4-local
^https?:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$ url script-request-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.request.bundle.js?v=1.0.4-local
^https?:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/player(\?.+)?$ url script-response-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.response.bundle.js?v=1.0.4-local
^https?:\/\/youtubei(?:-att)?\.googleapis\.com\/youtubei\/v1\/get_watch(\?.+)?$ url script-response-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.response.bundle.js?v=1.0.4-local
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext(\?.+)?$ url script-request-header https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/YouTube.request.bundle.js?v=1.0.4-local
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=(Official|External) url script-response-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/Composite.Subtitles.response.bundle.js?v=1.0.4-local
^https?:\/\/(www|m)\.youtube\.com\/api\/timedtext\?(.*)subtype=Translate url script-response-body https://raw.githubusercontent.com/Eugene-Prime/YouTube-subtitle/main/release-surge/Translate.response.bundle.js?v=1.0.4-local

#[MITM]
hostname = www.youtube.com, m.youtube.com, tv.youtube.com, music.youtube.com, youtubei.googleapis.com, youtubei-att.googleapis.com, -redirector*.googlevideo.com, *.googlevideo.com
